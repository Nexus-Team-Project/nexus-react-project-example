# This file starts the local PostgreSQL database used by the test backend.
services:
  postgres:
    image: postgres:15
    container_name: nexus-test-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexus_test
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexus_test"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
